name: deploy

on:
  workflow_dispatch:

jobs:
  deploy-local-dev:
    runs-on: [self-hosted, Linux, X64]
    env:
      KUBECONFIG: /home/victor/.kube/config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Preload local-dev images into Minikube
        run: ./scripts/bootstrap-local-dev-images.sh

      - name: Debug Kubernetes access
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "HOME=$HOME"
          echo "KUBECONFIG=$KUBECONFIG"
          kubectl config current-context
          kubectl cluster-info

      - name: Render local-dev overlay
        run: kubectl kustomize k8s/overlays/local-dev > rendered-local-dev.yaml

      - name: Client-side manifest validation
        run: kubectl apply --dry-run=client -f rendered-local-dev.yaml

      - name: Deploy shared platform infrastructure
        run: kubectl apply -k k8s/overlays/local-dev
