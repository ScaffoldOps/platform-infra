name: platform-infra

on:
  pull_request:
  push:
    branches:
      - main
      - develop
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    env:
      KUBECONFIG: /home/victor/.kube/config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Debug Kubernetes access
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "HOME=$HOME"
          echo "KUBECONFIG=$KUBECONFIG"
          kubectl config current-context
          kubectl cluster-info

      - name: Validate environment isolation and render all overlays
        run: |
          python3 scripts/validate-readiness.py validate local-dev --output rendered-local-dev.yaml
          python3 scripts/validate-readiness.py validate dev --output rendered-dev.yaml
          python3 scripts/validate-readiness.py validate pre --output rendered-pre.yaml

      - name: Test isolation and provisioning safeguards
        run: python3 -m unittest discover -s tests -p test_readiness.py -v

      - name: Client-side manifest validation
        run: |
          kubectl apply --dry-run=client -f rendered-local-dev.yaml
          kubectl apply --dry-run=client -f rendered-dev.yaml
          kubectl apply --dry-run=client -f rendered-pre.yaml
