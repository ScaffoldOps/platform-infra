apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scaffoldops-dev

resources:
  - ../../../base/database

# The existing DEV alias owns this Service and selects these database pods.
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      $patch: delete
