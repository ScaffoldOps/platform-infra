apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-bootstrap
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-bootstrap
          image: confluentinc/cp-kafka:7.7.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "Waiting for Kafka at kafka:9092"
                sleep 5
              done

              for topic in generation-requested generation-requested-dlt artifact-cleanup-requested deployment-requested undeployment-requested image-build-retry-requested; do
                kafka-topics \
                  --bootstrap-server kafka:9092 \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 1 --replication-factor 1
              done
