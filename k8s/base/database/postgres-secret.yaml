apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_KEYCLOAK_PASSWORD: keycloakpassword
  POSTGRES_GENERATOR_API_PASSWORD: generatorapipassword
  POSTGRES_GENERATOR_WORKER_PASSWORD: generatorworkerpassword
  POSTGRES_DEPLOYMENT_WORKER_PASSWORD: deploymentworkerpassword
