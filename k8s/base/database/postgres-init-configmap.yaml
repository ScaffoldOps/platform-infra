apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  01-init-multiple-databases.sh: |
    #!/bin/bash
    set -euo pipefail

    export PGPASSWORD="${POSTGRES_PASSWORD}"

    # This script is used both during first-time init and on every container start.
    # Wait for PostgreSQL to accept local TCP connections before reconciling roles/databases.
    until pg_isready --host 127.0.0.1 --port 5432 --username "${POSTGRES_USER}" >/dev/null 2>&1; do
      sleep 2
    done

    psql -v ON_ERROR_STOP=1 \
      --host 127.0.0.1 \
      --username "${POSTGRES_USER}" \
      --dbname "${POSTGRES_DB}" \
      -v keycloak_password="${POSTGRES_KEYCLOAK_PASSWORD}" \
      -v generator_api_password="${POSTGRES_GENERATOR_API_PASSWORD}" \
      -v generator_worker_password="${POSTGRES_GENERATOR_WORKER_PASSWORD}" \
      -v deployment_worker_password="${POSTGRES_DEPLOYMENT_WORKER_PASSWORD}" <<'SQL'
    SELECT format('CREATE ROLE keycloakuser LOGIN PASSWORD %L', :'keycloak_password')
    WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'keycloakuser')\gexec
    ALTER ROLE keycloakuser WITH LOGIN PASSWORD :'keycloak_password';

    SELECT format('CREATE ROLE generatorapiuser LOGIN PASSWORD %L', :'generator_api_password')
    WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'generatorapiuser')\gexec
    ALTER ROLE generatorapiuser WITH LOGIN PASSWORD :'generator_api_password';

    SELECT format('CREATE ROLE generatorworkeruser LOGIN PASSWORD %L', :'generator_worker_password')
    WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'generatorworkeruser')\gexec
    ALTER ROLE generatorworkeruser WITH LOGIN PASSWORD :'generator_worker_password';

    SELECT format('CREATE ROLE deploymentworkeruser LOGIN PASSWORD %L', :'deployment_worker_password')
    WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'deploymentworkeruser')\gexec
    ALTER ROLE deploymentworkeruser WITH LOGIN PASSWORD :'deployment_worker_password';

    SELECT 'CREATE DATABASE keycloakdb OWNER keycloakuser'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloakdb')\gexec
    ALTER DATABASE keycloakdb OWNER TO keycloakuser;
    GRANT ALL PRIVILEGES ON DATABASE keycloakdb TO keycloakuser;

    SELECT 'CREATE DATABASE generatorapidb OWNER generatorapiuser'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'generatorapidb')\gexec
    ALTER DATABASE generatorapidb OWNER TO generatorapiuser;
    GRANT ALL PRIVILEGES ON DATABASE generatorapidb TO generatorapiuser;

    SELECT 'CREATE DATABASE generatorworkerdb OWNER generatorworkeruser'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'generatorworkerdb')\gexec
    ALTER DATABASE generatorworkerdb OWNER TO generatorworkeruser;
    GRANT ALL PRIVILEGES ON DATABASE generatorworkerdb TO generatorworkeruser;

    SELECT 'CREATE DATABASE deploymentworkerdb OWNER deploymentworkeruser'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'deploymentworkerdb')\gexec
    ALTER DATABASE deploymentworkerdb OWNER TO deploymentworkeruser;
    GRANT ALL PRIVILEGES ON DATABASE deploymentworkerdb TO deploymentworkeruser;
    SQL
