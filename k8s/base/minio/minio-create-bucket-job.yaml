apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-create-bucket
          image: pgsty/mc:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc ready local; do
                echo "Waiting for MinIO at minio:9000"
                sleep 5
              done
              mc mb --ignore-existing local/scaffoldops-artifacts
